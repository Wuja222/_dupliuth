<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <title>Heart</title>
    <meta name="Generator" content="EditPlus" />
    <meta name="Author" content="" />
    <meta name="Keywords" content="" />
    <meta name="Description" content="" />
    <script src="music.js" data-music-player></script>

    <style>
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box {
        width: 100%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }

      .greeting {
        position: fixed;
        z-index: 11;
        top: max(12px, calc(50% - 330px));
        left: 50%;
        width: 100vw;
        margin: 0;
        padding: 0 16px;
        color: #ff8fc4;
        font:
          italic 700 clamp(1.5rem, 5vw, 2.5rem) "Arial",
          sans-serif;
        text-align: center;
        text-shadow: 0 0 12px rgb(255 92 164 / 70%);
        transform: translateX(-50%);
      }

      .letter-note {
        position: fixed;
        z-index: 9;
        top: calc(50% + 260px);
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: max-content;
        max-width: calc(100vw - 24px);
        color: #ff8fc4;
        font:
          italic 700 clamp(1rem, 4vw, 1.35rem) "Arial",
          sans-serif;
        text-shadow: 0 0 10px rgb(255 92 164 / 65%);
        transform: translateX(-50%);
      }

      .letter-button {
        display: block;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: transparent;
        cursor: pointer;
        transition:
          transform 180ms ease,
          filter 180ms ease;
      }

      .letter-button img {
        display: block;
        width: clamp(54px, 16vw, 72px);
        height: auto;
        filter: drop-shadow(0 0 8px rgb(255 143 196 / 50%));
      }

      .letter-button:hover {
        filter: brightness(1.08);
        transform: translateY(-4px) scale(1.06);
      }

      .letter-button:focus-visible {
        outline: 3px solid #ff8fc4;
        outline-offset: 5px;
      }

      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .love-floaters {
        position: fixed;
        z-index: 1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .love-word {
        position: absolute;
        bottom: -32px;
        left: var(--left);
        color: #ff8fc4;
        font:
          600 var(--size) "Arial",
          sans-serif;
        text-shadow: 0 0 10px rgba(255, 92, 164, 0.55);
        opacity: 0;
        animation: love-float var(--duration) linear var(--delay) infinite;
        will-change: transform, opacity;
      }

      .center-text {
        position: relative;
        z-index: 3;
        background-color: rgb(0, 0, 0);
        width: 100%;
        color: rgb(225, 12, 168);
        height: 100%;
        font-size: 31px;
        font-style: italic;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 5px;
        text-align: center;
      }
      #pinkboard {
        position: relative;
        margin: auto;
        height: 500px;
        width: 500px;
        animation: animate 1.3s infinite;
      }

      .true-love-photo {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: clamp(112px, 28vw, 158px);
        aspect-ratio: 4 / 5;
        object-fit: cover;
        object-position: center 35%;
        border: 4px solid #ff8fc4;
        border-radius: 50%;
        box-shadow:
          0 0 0 5px rgb(255 143 196 / 20%),
          0 0 28px rgb(255 92 164 / 65%);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      #pinkboard:before,
      #pinkboard:after {
        content: "";
        position: absolute;
        background: #ff5ca4;
        width: 100px;
        height: 160px;
        border-top-left-radius: 50px;
        border-top-right-radius: 50px;
      }

      #pinkboard:before {
        left: 100px;
        transform: rotate(-45deg);
        transform-origin: 0 100%;
        box-shadow:
          0 14px 28px rgba(0, 0, 0, 0.25),
          0 10px 10px rgba(0, 0, 0, 0.22);
      }

      #pinkboard:after {
        left: 0;
        transform: rotate(45deg);
        transform-origin: 100% 100%;
      }

      @keyframes animate {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(0.8);
        }
        60% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes love-float {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(-12deg);
        }
        10%,
        78% {
          opacity: 0.8;
        }
        100% {
          opacity: 0;
          transform: translate3d(var(--drift), -115vh, 0) rotate(24deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .love-word {
          display: none;
          animation: none;
        }
      }

      @media (max-width: 680px) {
        .love-floaters {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="love-floaters" aria-hidden="true"></div>
    <h1 class="greeting">Chúc cậu 20/10 vui vẻ</h1>
    <div class="letter-note">
      <span>Đôi lời gửi gắm</span>
      <span aria-hidden="true">👉</span>
      <a class="letter-button" href="letter.html" aria-label="Mở lá thư">
        <img src="th%C6%B0.png" alt="" />
      </a>
    </div>
    <div class="box">
      <canvas id="pinkboard"></canvas>
      <img class="true-love-photo" src="True%20Love.jpg" alt="Ảnh True Love" />
    </div>
    <script>
      var settings = {
        particles: {
          length: 2000,
          duration: 2,
          velocity: 100,
          effect: -1.3,
          size: 13,
        },
      };

      (function () {
        var b = 0;
        var c = ["ms", "moz", "webkit", "o"];
        for (var a = 0; a < c.length && !window.requestAnimationFrame; ++a) {
          window.requestAnimationFrame = window[c[a] + "RequestAnimationFrame"];
          window.cancelAnimationFrame =
            window[c[a] + "CancelAnimationFrame"] ||
            window[c[a] + "CancelRequestAnimationFrame"];
        }
        if (!window.requestAnimationFrame) {
          window.requestAnimationFrame = function (h, e) {
            var d = new Date().getTime();
            var f = Math.max(0, 16 - (d - b));
            var g = window.setTimeout(function () {
              h(d + f);
            }, f);
            b = d + f;
            return g;
          };
        }
        if (!window.cancelAnimationFrame) {
          window.cancelAnimationFrame = function (d) {
            clearTimeout(d);
          };
        }
      })();

      var Point = (function () {
        function Point(x, y) {
          this.x = typeof x !== "undefined" ? x : 0;
          this.y = typeof y !== "undefined" ? y : 0;
        }
        Point.prototype.clone = function () {
          return new Point(this.x, this.y);
        };
        Point.prototype.length = function (length) {
          if (typeof length == "undefined")
            return Math.sqrt(this.x * this.x + this.y * this.y);
          this.normalize();
          this.x *= length;
          this.y *= length;
          return this;
        };
        Point.prototype.normalize = function () {
          var length = this.length();
          this.x /= length;
          this.y /= length;
          return this;
        };
        return Point;
      })();

      var Particle = (function () {
        function Particle() {
          this.position = new Point();
          this.velocity = new Point();
          this.acceleration = new Point();
          this.age = 0;
        }
        Particle.prototype.initialize = function (x, y, dx, dy) {
          this.position.x = x;
          this.position.y = y;
          this.velocity.x = dx;
          this.velocity.y = dy;
          this.acceleration.x = dx * settings.particles.effect;
          this.acceleration.y = dy * settings.particles.effect;
          this.age = 0;
        };
        Particle.prototype.update = function (deltaTime) {
          this.position.x += this.velocity.x * deltaTime;
          this.position.y += this.velocity.y * deltaTime;
          this.velocity.x += this.acceleration.x * deltaTime;
          this.velocity.y += this.acceleration.y * deltaTime;
          this.age += deltaTime;
        };
        Particle.prototype.draw = function (context, image) {
          function ease(t) {
            return --t * t * t + 1;
          }
          var size = image.width * ease(this.age / settings.particles.duration);
          context.globalAlpha = 1 - this.age / settings.particles.duration;
          context.drawImage(
            image,
            this.position.x - size / 2,
            this.position.y - size / 2,
            size,
            size,
          );
        };
        return Particle;
      })();

      var ParticlePool = (function () {
        var particles,
          firstActive = 0,
          firstFree = 0,
          duration = settings.particles.duration;

        function ParticlePool(length) {
          particles = new Array(length);
          for (var i = 0; i < particles.length; i++)
            particles[i] = new Particle();
        }
        ParticlePool.prototype.add = function (x, y, dx, dy) {
          particles[firstFree].initialize(x, y, dx, dy);

          firstFree++;
          if (firstFree == particles.length) firstFree = 0;
          if (firstActive == firstFree) firstActive++;
          if (firstActive == particles.length) firstActive = 0;
        };
        ParticlePool.prototype.update = function (deltaTime) {
          var i;

          if (firstActive < firstFree) {
            for (i = firstActive; i < firstFree; i++)
              particles[i].update(deltaTime);
          }
          if (firstFree < firstActive) {
            for (i = firstActive; i < particles.length; i++)
              particles[i].update(deltaTime);
            for (i = 0; i < firstFree; i++) particles[i].update(deltaTime);
          }

          while (
            particles[firstActive].age >= duration &&
            firstActive != firstFree
          ) {
            firstActive++;
            if (firstActive == particles.length) firstActive = 0;
          }
        };
        ParticlePool.prototype.draw = function (context, image) {
          if (firstActive < firstFree) {
            for (i = firstActive; i < firstFree; i++)
              particles[i].draw(context, image);
          }
          if (firstFree < firstActive) {
            for (i = firstActive; i < particles.length; i++)
              particles[i].draw(context, image);
            for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
          }
        };
        return ParticlePool;
      })();

      (function (canvas) {
        var context = canvas.getContext("2d"),
          particles = new ParticlePool(settings.particles.length),
          particleRate =
            settings.particles.length / settings.particles.duration, // particles/sec
          time;

        function pointOnHeart(t) {
          return new Point(
            160 * Math.pow(Math.sin(t), 3),
            130 * Math.cos(t) -
              50 * Math.cos(2 * t) -
              20 * Math.cos(3 * t) -
              10 * Math.cos(4 * t) +
              25,
          );
        }

        var image = (function () {
          var canvas = document.createElement("canvas"),
            context = canvas.getContext("2d");
          canvas.width = settings.particles.size;
          canvas.height = settings.particles.size;
          function to(t) {
            var point = pointOnHeart(t);
            point.x =
              settings.particles.size / 2 +
              (point.x * settings.particles.size) / 350;
            point.y =
              settings.particles.size / 2 -
              (point.y * settings.particles.size) / 350;
            return point;
          }

          context.beginPath();
          var t = -Math.PI;
          var point = to(t);
          context.moveTo(point.x, point.y);
          while (t < Math.PI) {
            t += 0.01;
            point = to(t);
            context.lineTo(point.x, point.y);
          }
          context.closePath();
          context.fillStyle = "#FF5CA4";
          context.fill();
          var image = new Image();
          image.src = canvas.toDataURL();
          return image;
        })();

        function render() {
          requestAnimationFrame(render);

          var newTime = new Date().getTime() / 1000,
            deltaTime = newTime - (time || newTime);
          time = newTime;

          context.clearRect(0, 0, canvas.width, canvas.height);

          var amount = particleRate * deltaTime;
          for (var i = 0; i < amount; i++) {
            var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
            var dir = pos.clone().length(settings.particles.velocity);
            particles.add(
              canvas.width / 2 + pos.x,
              canvas.height / 2 - pos.y,
              dir.x,
              -dir.y,
            );
          }

          particles.update(deltaTime);
          particles.draw(context, image);
        }

        function onResize() {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
        }
        window.onresize = onResize;

        setTimeout(function () {
          onResize();
          render();
        }, 10);
      })(document.getElementById("pinkboard"));
    </script>
    <script>
      (function () {
        var layer = document.querySelector(".love-floaters");
        var wordCount = 24;
        var safeHalfWidth = Math.min(
          360,
          Math.max(230, window.innerWidth * 0.36),
        );
        var center = window.innerWidth / 2;

        for (var i = 0; i < wordCount; i++) {
          var word = document.createElement("span");
          var duration = 9 + Math.random() * 8;
          var onLeft = Math.random() < 0.5;
          var left = onLeft
            ? Math.random() * Math.max(0, center - safeHalfWidth - 44)
            : center +
              safeHalfWidth +
              Math.random() * Math.max(0, center - safeHalfWidth - 44);
          word.className = "love-word";
          word.textContent = "love";
          word.style.setProperty("--left", left + "px");
          word.style.setProperty("--size", 14 + Math.random() * 13 + "px");
          word.style.setProperty("--duration", duration + "s");
          word.style.setProperty("--delay", -Math.random() * duration + "s");
          word.style.setProperty("--drift", Math.random() * 32 - 16 + "px");
          layer.appendChild(word);
        }
      })();
    </script>
    <div class="center-text">Anh Yêu Em</div>
  </body>
</html>
